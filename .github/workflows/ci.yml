# 두 갈래 이상으로 갈라진 브랜치가 같은 파일을 고치는 동안 회귀를 잡아 줄 장치가 없었다.
# typecheck와 테스트는 차단, lint는 기준선(scripts/lint-baseline.json)을 넘는 증가만 차단한다.
#
# `pnpm run <script>`는 이 저장소의 pnpm-workspace.yaml 때문에 'packages field missing or empty'로
# 실패한다(이 워크플로 도입 이전부터의 동작). 그래서 각 단계는 node로 직접 실행한다.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Test
        run: node scripts/test.mjs

      - name: Lint (baseline gate)
        run: node scripts/lint-gate.mjs

      # tests/research_worker_test.py는 로컬 HTTP 서버와의 소켓 읽기 경합으로 간헐 실패한다
      # (2026-09-22 측정: 12회 중 2회, test_scoped_machine_request_without_human_identity).
      # 커버리지는 유지하되 이 경합이 고쳐질 때까지 차단하지 않는다.
      - name: Worker contract test (non-blocking, known flake)
        continue-on-error: true
        run: python3 tests/research_worker_test.py
